<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora web">
    <meta name="author" content="Juan Manuel Fernández Rodríguez">
    <title>Calculadora</title>
    <link rel="shortcut icon" href="./imagenes/calculator-icon-windows-v1.ico" type="image/x-icon">
    <link rel="stylesheet" href="./estilos.css">
</head>
<body class="disenyo-principal">

    <header class="cabecera-principal">
        <h1 class="titulo-calc">Calculadora</h1>
    </header>

    <main class="contenido-principal">
        <div class="contenedor-calculadora">
            <div id="pantalla" class="pantalla-calc texto-defecto">0</div>
            <div class="cuadricula-calc">
                <!-- 1ª fila -->
                <button class="boton boton-control boton-ancho" id="borrar-entrada">CE</button>
                <button class="boton boton-control" id="borrar-todo">C</button>
                <button class="boton boton-control" id="retroceso">⌫</button>
                <!-- 2ª fila -->
                <button class="boton boton-funcion" id="op-inverso"></button>
                <button class="boton boton-funcion" id="op-cuadrado"></button>
                <button class="boton boton-funcion" id="op-raiz"></button>
                <button class="boton boton-operacion" id="op-division">/</button>
                <!-- 3ª fila -->
                <button class="boton boton-numero">7</button>
                <button class="boton boton-numero">8</button>
                <button class="boton boton-numero">9</button>
                <button class="boton boton-operacion" id="op-multiplicacion">x</button>
                <!-- 4ª fila -->
                <button class="boton boton-numero">4</button>
                <button class="boton boton-numero">5</button>
                <button class="boton boton-numero">6</button>
                <button class="boton boton-operacion" id="op-resta">-</button>
                <!-- 5ª fila -->
                <button class="boton boton-numero">1</button>
                <button class="boton boton-numero">2</button>
                <button class="boton boton-numero">3</button>
                <button class="boton boton-operacion" id="op-suma">+</button>
                <!-- 6ª fila -->
                <button class="boton boton-numero boton-ancho">0</button>
                <button class="boton boton-punto" id="id-punto">.</button>
                <button class="boton boton-igual" id="id-igual">=</button>
            </div>
        </div>
    </main>

    <footer class="pie-principal">
        <p class="info-pie">Ejercicio 02 UD 03 - Lenguajes de marcas y sistemas de gestión de información.</p>
        <p class="autor-pie"><u>Proyecto realizado por</u>: 👉 JUANMA FERNÁNDEZ 👈 (Declaro que no he usado IA en el proyecto)</p>
    </footer>
    <script src="./js/javascript.js"></script>
</body>
</html>
